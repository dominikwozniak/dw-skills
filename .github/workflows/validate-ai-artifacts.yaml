name: Validate .ai artifacts

on:
  pull_request:
    paths:
      - ".ai/**"
      - scripts/tests/**
      # Filter on the canon, never the plugin symlinks: editing scripts/runtime/<s>.sh
      # leaves each plugins/<p>/scripts/<s>.sh blob (the link target string) untouched,
      # so a plugins/** filter never fires for it and the self-tests would be skipped.
      - scripts/runtime/**
      # hooks-in-sync + the two hook self-tests read templates/hooks/ directly.
      - templates/**
      - scripts/validate-artifacts.sh
      - .github/workflows/validate-ai-artifacts.yaml
  push:
    branches: [main]
    paths:
      - ".ai/**"
      - scripts/tests/**
      # Filter on the canon, never the plugin symlinks: editing scripts/runtime/<s>.sh
      # leaves each plugins/<p>/scripts/<s>.sh blob (the link target string) untouched,
      # so a plugins/** filter never fires for it and the self-tests would be skipped.
      - scripts/runtime/**
      # hooks-in-sync + the two hook self-tests read templates/hooks/ directly.
      - templates/**
      - scripts/validate-artifacts.sh
      - .github/workflows/validate-ai-artifacts.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate .ai artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - name: Validate artifacts
        shell: bash
        run: ./scripts/validate-artifacts.sh
