# agnix lint config — dw-skills is a Claude Code skills marketplace.
# Docs: https://agent-sh.github.io/agnix/docs/configuration
target = "ClaudeCode"
severity = "Warning"

exclude = [
    "node_modules/**",
    ".git/**",
    # Local agent state (gitignored) — not part of the marketplace surface,
    # so agnix doesn't lint the local drops.
    ".claude/**",
    # Template payloads — inert files copied verbatim INTO a target project
    # (settings.json / hooks / CLAUDE.local.md, plus the artifact shapes under
    # skills/*/references/templates/). They reference `.claude/` paths and hook
    # scripts that only exist once dropped, so they're not validatable in
    # place — same rationale as above. `templates/` is the shared canon: both
    # dw-bootstrap (team lane) and dw-init (solo lane) copy from it.
    "templates/**",
    "skills/*/references/templates/**",
]

[rules]
skills = true
hooks = true
plugins = true
mcp = true
frontmatter_validation = true
import_references = true
